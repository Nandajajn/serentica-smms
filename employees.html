<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <title>Employees | Serentica Site Manpower Management System</title>
  <style>
    .toolbar { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--space-3); align-items: end; }
    .toolbar .wide { grid-column: span 2; }
    .field-row { display: grid; gap: 4px; }
    .field-row label { font-size: var(--fs-sm); font-weight: 500; }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
    .table-wrap { overflow-x: auto; }
    table.table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
    .table th, .table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .table th { background: var(--bg); font-weight: 600; }
    .table th button { all: unset; cursor: pointer; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
    .table th button:focus-visible { outline: 2px solid var(--primary-dark); outline-offset: 2px; }
    .table tbody tr:hover { background: var(--primary-tint); }
    .small { font-size: var(--fs-sm); }
    select.input { width: 100%; }
    .badge-ok { background: var(--success-bg); color: var(--success); }
    .badge-warn { background: var(--warning-bg); color: var(--warning); }
    .badge-off { background: var(--bg); color: var(--muted); }
    .pager { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-4); }
    .empty { text-align: center; padding: var(--space-6) var(--space-4); color: var(--muted); }
  </style>
</head>
<body>
  <main id="page-content">
    <div class="page-head">
      <h1>Employees</h1>
      <p>Everyone you are allowed to see. Search, filter and sort the list, and open a name to see the full profile.</p>
    </div>
    <div class="card" id="controls"></div>
    <div class="card" id="list" style="margin-top:24px"></div>
  </main>
  <script type="module" src="js/pages/employees.js"></script>
</body>
</html>
