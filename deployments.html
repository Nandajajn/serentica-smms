<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <title>Deployments | Serentica Site Manpower Management System</title>
  <style>
    .stack > * + * { margin-top: var(--space-5); }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
    .small { font-size: var(--fs-sm); }
    .toolbar { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--space-3); align-items: end; }
    .field-row { display: grid; gap: 4px; }
    .field-row label { font-size: var(--fs-sm); font-weight: 500; }
    select.input { width: 100%; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--space-3); }
    .tile { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-4); background: var(--surface); cursor: pointer; text-align: left; font: inherit; }
    .tile b { display: block; font-size: var(--fs-xl); }
    .tile:hover, .tile.is-on { border-color: var(--primary); background: var(--primary-tint); }
    .table-wrap { overflow-x: auto; }
    table.table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
    .table th, .table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .table th { background: var(--bg); font-weight: 600; white-space: nowrap; }
    .table td.wrap { white-space: normal; min-width: 200px; }
    .table tbody tr:hover { background: var(--primary-tint); }
    .badge-ok { background: var(--success-bg); color: var(--success); }
    .badge-warn { background: var(--warning-bg); color: var(--warning); }
    .badge-bad { background: var(--danger-bg); color: var(--danger); }
    .badge-off { background: var(--bg); color: var(--muted); }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--space-5); }
    dl.facts { display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; margin: 0; font-size: var(--fs-sm); }
    dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; word-break: break-word; }
    .card h2 { font-size: var(--fs-base); margin-bottom: var(--space-3); }
    textarea.input { min-height: 72px; resize: vertical; }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-good { background: var(--success); border-color: var(--success); color: #fff; }
    .empty { text-align: center; padding: var(--space-6) var(--space-4); color: var(--muted); }
    .next { background: var(--info-bg); border: 1px solid var(--primary); border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-size: var(--fs-sm); }
  </style>
</head>
<body>
  <main id="page-content">
    <div id="banner" hidden></div>
    <div id="view"></div>
  </main>
  <script type="module" src="js/pages/deployments.js"></script>
</body>
</html>
